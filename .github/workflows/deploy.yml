# Deploy: only on push to main (dev = default branch)
name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy on VPS (Frontend port 3231)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            REPO_URL="https://github.com/${{ github.repository }}.git"
            if [ ! -d /var/www/myapp-frontend ]; then
              mkdir -p /var/www/myapp-frontend
              git clone -b main "$REPO_URL" /var/www/myapp-frontend
            fi
            cd /var/www/myapp-frontend
            git fetch origin main
            git reset --hard origin/main
            docker compose -p anode-crm-frontend -f docker-compose.yml up -d --build
            echo 'Frontend anode-crm-frontend (3231) deployed.'
