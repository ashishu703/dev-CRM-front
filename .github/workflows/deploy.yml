# Deploy: only on push to main (dev = default branch)
name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy on VPS (Frontend port 3231)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            FRONTEND_REPO="https://github.com/ashishu703/dev-CRM-front.git"
            if [ ! -d /var/www/myapp-frontend ]; then
              mkdir -p /var/www/myapp-frontend
              git clone -b main "$FRONTEND_REPO" /var/www/myapp-frontend
            fi
            cd /var/www/myapp-frontend
            git remote set-url origin "$FRONTEND_REPO" 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            docker compose -p anode-crm-frontend -f docker-compose.yml up -d --build
            echo 'Frontend anode-crm-frontend (3231) deployed.'
            if [ -f deploy/nginx-dev.anocabapp.com.conf ]; then
              sudo cp deploy/nginx-dev.anocabapp.com.conf /etc/nginx/sites-available/dev.anocabapp.com
              sudo ln -sf /etc/nginx/sites-available/dev.anocabapp.com /etc/nginx/sites-enabled/
              sudo nginx -t && sudo systemctl reload nginx
              echo 'Nginx dev.anocabapp.com updated and reloaded.'
            fi
