

# 1. HTTP to HTTPS Redirect
server {
    listen 80;
    server_name dev.anocabapp.com;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server Block
server {
    listen 443 ssl;
    server_name dev.anocabapp.com;

    # SSL Certificates - Certbot paths
    ssl_certificate /etc/letsencrypt/live/dev.anocabapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.anocabapp.com/privkey.pem;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Frontend (container on 3231)
    location / {
        proxy_pass http://127.0.0.1:3231;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API -> backend (3232)
    location /api/ {
        proxy_pass http://127.0.0.1:3232;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Socket.io -> backend (3232)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3232;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}